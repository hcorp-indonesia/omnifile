assert_lefthook_installed: true

pre-commit:
  parallel: true
  commands:
    lint-web:
      root: apps/web
      run: bunx oxlint
    lint-api:
      root: apps/api
      run: go fmt ./... && go vet ./...

pre-push:
  parallel: true
  commands:
    type-check:
      root: apps/web
      run: bunx tsc --noEmit
    lint-web:
      root: apps/web
      run: bunx oxlint
    lint-api:
      root: apps/api
      run: go fmt ./... && go vet ./...
    test-api:
      root: apps/api
      run: go test ./...
    security-scan:
      run: 'C:/laragon/www/marga-mulya-system/.bin/trivy/trivy.exe fs --scanners vuln,secret,config --exit-code 1 --severity HIGH,CRITICAL .'
    go-build:
      root: apps/api
      run: go build ./...
