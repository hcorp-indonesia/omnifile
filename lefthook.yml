# Lefthook Git Hooks Configuration
# https://github.com/evilmartians/lefthook

pre-push:
  parallel: true
  commands:
    type-check:
      root: apps/web
      run: bunx tsc --noEmit
    lint-web:
      root: apps/web
      run: bunx oxlint
    lint-api:
      root: apps/api
      run: go fmt ./... && go vet ./...
    security-scan:
      run: trivy fs --scanners vuln,secret,config --exit-code 1 --severity HIGH,CRITICAL .
    go-build:
      root: apps/api
      run: go build ./...
