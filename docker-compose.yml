services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      FIBER_PREFORK: "false"
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      SERVER_READ_TIMEOUT: ${SERVER_READ_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DRAGONFLY_ADDR: ${DRAGONFLY_ADDR:?DRAGONFLY_ADDR is required}
      DRAGONFLY_USERNAME: ${DRAGONFLY_USERNAME:-}
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD:-}
      DRAGONFLY_DB: ${DRAGONFLY_DB:-0}
      DRAGONFLY_KEY_PREFIX: ${DRAGONFLY_KEY_PREFIX:-magic_converter}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-Origin, Content-Type, Accept, Authorization}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-GET,POST,DELETE,OPTIONS,PUT,PATCH}
      CORS_EXPOSE_HEADERS: ${CORS_EXPOSE_HEADERS:-X-Remove-Bg-Original-Format,X-Remove-Bg-Converted-Format,X-Remove-Bg-Original-Size,X-Remove-Bg-Result-Size,X-Remove-Bg-Original-Width,X-Remove-Bg-Original-Height,X-Remove-Bg-Width,X-Remove-Bg-Height,X-Remove-Bg-Model}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PDFCO_API_KEY: ${PDFCO_API_KEY:-}

      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-magic-converter}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-}
      RUSTFS_USE_PATH_STYLE: ${RUSTFS_USE_PATH_STYLE:-true}

      TESSERACT_PATH: /usr/bin/tesseract
      TESSERACT_LANG: ${TESSERACT_LANG:-eng+ind}
      REALESRGAN_MODEL_PATH: /app/models/RealESRGAN_x4plus.pth
      REALESRGAN_ENGINE: ${REALESRGAN_ENGINE:-python}
      REALESRGAN_NCNN_PATH: /app/realesrgan-ncnn-vulkan/realesrgan-ncnn-vulkan
      REALESRGAN_NCNN_MODELS_PATH: /app/realesrgan-ncnn-vulkan/models
      REALESRGAN_NCNN_MODEL: ${REALESRGAN_NCNN_MODEL:-realesr-animevideov3}
      REMBG_MODEL_DIR: /app/models/rembg
      REMBG_PROVIDER: cpu
      REMBG_CPU_THREADS: ${REMBG_CPU_THREADS:-4}
    volumes:
      - model_cache:/app/models

volumes:
  model_cache:
